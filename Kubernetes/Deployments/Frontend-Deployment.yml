apiVersion: v1
kind: Deployment
metadata:
  name: Frontend_Deployment
  namespace: development-environment
  labels:
    app.kubernetes.io/name: frontend-deployment
    app.kubernetes.io/component: frontend
    app.kubernetes.io/partof: To-Do-Application
spec:
  replicas: 2
  selector: 
    matchLabels:
      app.kubernetes.io/name: frontend-deployment
    template:
      metadata:
        labels:
          app.kubernetes.io/name: frontend-deployment
          app.kubernetes.io/component: frontend
      spec:
        containers:
        - name: frontend
          image: sanrose27/kubernetes-frontend:latest
          ports: 
            - containerPort: 80
          env:
          - name: BACKEND_API_URL
            valueFrom:
              configMapKeyRef:
                name: Application-Config
                key: BACKEND_API_URL