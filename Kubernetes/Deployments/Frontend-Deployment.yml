apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: development-environment
  labels:
    app.kubernetes.io/name: todo-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: To-Do-Application
spec:
  replicas: 2
  selector: 
    matchLabels:
      app.kubernetes.io/name: todo-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-frontend
        app.kubernetes.io/component: frontend
        app.kubnernetes.io/part-of: To-Do-Application
    spec:
      containers:
      - name: frontend
        image: sanrose27/kubernetes-frontend:latest
        ports: 
          - containerPort: 80
        # env:
        # - name: BACKEND_API_URL
        #   valueFrom:
        #     configMapKeyRef:
        #       name: Application-Config
        #       key: BACKEND_API_URL