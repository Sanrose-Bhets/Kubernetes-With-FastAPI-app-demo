apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: development-environment
  labels:
    app.kubernetes.io/name: Todo-Backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: To-Do-Application
spec:
  replicas: 2
  selector: 
    matchLabels:
      app.kubernetes.io/name: Todo-Backend
      app.kubernetes.io/component: backend-api
      app.kubernetes.io/part-of: To-Do-Application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: Todo-Backend
        app.kubernetes.io/component: backend-api
        app.kubernetes.io/part-of: To-Do-Application
    spec:
      containers:
      - name: backend
        image: sanrose27/kubernetes-backend:latest
        ports: 
          - containerPort: 8000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: application-secrets
              key: MONGO_URI
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: application-secrets
              key: DB_NAME
