apiVersion: v1
kind: Deployment
metadata:
  name: Backend_Deployment
  labels:
    app: TO_DO
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: backend-service
    template:
      metadata:
        labels:
          app: backend-service
      spec:
        containers:
        - name: backend
          image: sanrose27/kubernetes-backend:latest
          ports: 
            - containerPort: 8000
          env:
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: Application-Secrets
                key: MONGO_URI
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: Application-Secrets
                key: DB_NAME
