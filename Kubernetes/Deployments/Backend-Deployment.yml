apiVersion: apps/v1
kind: Deployment
metadata:
  name: Backend_Deployment
  namespace: demo-application-ns
  labels:
    app.kubernetes.io/name: Todo-Backend
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/partof: To-Do-Application
spec:
  replicas: 2
  selector: 
    matchLabels:
      app.kubernetes.io/name: Todo-Backend
      app.kubernetes.io/component: backend-api
      app.kubernetes.io/partof: To-Do-Application
    template:
      metadata:
        labels:
          app.kubernetes.io/name: Todo-Backend
          app.kubernetes.io/component: backend-api
          app.kubernetes.io/partof: To-Do-Application
      spec:
        containers:
        - name: backend
          image: sanrose27/kubernetes-backend:latest
          ports: 
            - containerPort: 8000
          env:
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: Application-Secrets
                key: MONGO_URI
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: Application-Secrets
                key: DB_NAME
