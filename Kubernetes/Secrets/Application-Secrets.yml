#Normally, an external Secret manager is also used along with K8 Secrets
apiVersion: v1
kind: Secret
metadata:
  name: application-secrets
  namespace: development-environment
type: Opaque
#bad practice to store secrets in plain text. Use base64 encoding for sensitive data.
#for demo keeping in plain text. use external secret manager like vault etc for prod
stringData: 
  MONGO_URI: "mongodb://admin:password@database-service:27017/?authSource=admin" # either base encode or keep in configmap
  DB_NAME: "todo_db" #need to base encode